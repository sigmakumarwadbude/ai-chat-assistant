
services:
  angular-app:
    image: node:24-alpine
    container_name: ai-chat-assistant-dev

    working_dir: /app

    ports:
      - "4200:4200"

    volumes:
      - .:/app
      - node_modules:/app/node_modules

    command: sh -c "npm ci && npm start -- --host 0.0.0.0"

volumes:
  node_modules:
